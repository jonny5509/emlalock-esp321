[platformio]
default_envs = wearer

[env]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@^2.8
build_flags =
  -I src

[env:wearer]
extends = env
build_flags =
  ${env.build_flags}
  -DDEVICE_ROLE_WEARER

[env:keyholder]
extends = env
build_flags =
  ${env.build_flags}
  -DDEVICE_ROLE_KEYHOLDER
